name: Ping Supabase to Keep Alive

on:
  schedule:
    - cron: '0 0 */6 * *' # Roda a cada 6 dias
  workflow_dispatch: # Permite rodar manualmente no GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -sS -X GET "$SUPABASE_URL/rest/v1/transacoes?limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
